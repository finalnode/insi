[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insi"
version = "0.8.0.dev0"
description = "Offline-first desktop learning environment for modular computer science courses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "in:si contributors" }]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
  "PyKIM==0.6.0",
  "certifi==2026.7.22",
  "cryptography==46.0.7",
  "nicegui[native]==3.16.0",
  "packaging==26.3",
  "PyYAML==6.0.3",
  "Send2Trash==1.8.3",
  "tomli==2.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
build = [
  "pillow==12.3.0",
  "pyinstaller==6.22.2",
  "pywebview[gtk]==6.2.1; sys_platform == 'linux'",
  # pythonnet 3.1.0 bleibt für normale Windows-Installationen kompatibel.
  "pythonnet==3.0.5; sys_platform == 'win32'",
]

[project.scripts]
insi = "insi.app:main"
insi-teacher = "insi.submission.cli:main"

[project.entry-points."pykim.trainer_provider"]
insi = "insi.training.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["insi*"]

[tool.setuptools]
license-files = ["LICENSE", "LICENSING.md", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.data-files]
"share/insi/documentation" = ["docs/*.md"]
"share/insi/documentation/de" = ["docs/de/*.md"]
"share/insi/documentation/en" = ["docs/en/*.md"]

[tool.setuptools.package-data]
insi = [
  "assets/*.css",
  "assets/*.js",
  "assets/*.png",
  "markdown_editor.js",
  "vendor/toastui_editor/*.css",
  "vendor/toastui_editor/*.js",
  "vendor/toastui_editor/*.txt",
  "content-manifest.json",
  "course_catalog.json",
  "Skripte/imperativ/*.md",
  "Skripte/oop/*.md",
  "Skripte/README.md",
  "Aufgaben/imperativ/*.md",
  "Aufgaben/oop/*.md",
  "Trainer/*.yml",
]

[tool.pytest.ini_options]
addopts = "-ra -m 'not e2e'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "e2e: browserloser NiceGUI-Gesamtworkflow (explizit mit -m e2e starten)",
  "anyio: asynchroner Test über AnyIO",
  "nicegui_main_file(path): Einstiegspunkt für NiceGUIs User-Simulation",
]
