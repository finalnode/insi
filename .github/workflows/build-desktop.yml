name: Desktop-Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux-Sandbox installieren
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "git+https://github.com/finalnode/PyKIM.git@main"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Release-Tag gegen Projektversion prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_release_version.py "${{ github.ref_name }}"

  windows:
    name: Windows x86_64
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python tools/build_desktop_app.py
      - name: Eingebettetes Python prüfen
        shell: pwsh
        run: '& "dist/windows/insi/insi-python.exe" --pykim-python -c "import clr, pykim; clr.AddReference(''System.Windows.Forms''); print(pykim.__version__)"'
      - name: Windows-AppContainer und Job Object prüfen
        shell: pwsh
        run: '& "dist/windows/insi/insi-python.exe" --pykim-python tools/check_windows_sandbox.py'
      - name: Kompatible pythonnet-Runtime prüfen
        shell: pwsh
        run: |
          $runtime = 'dist/windows/insi/_internal/pythonnet/runtime'
          if (-not (Test-Path "$runtime/Python.Runtime.dll")) {
            throw 'Python.Runtime.dll fehlt im Windows-Build.'
          }
          $facades = @(Get-ChildItem $runtime -Filter 'System.*.dll')
          if ($facades.Count -ne 0) {
            throw "Unerwartete pythonnet-3.1-Fassaden im Build: $($facades.Name -join ', ')"
          }
      - name: Echtes Windows-Fenster prüfen
        shell: pwsh
        run: ./tools/check_windows_desktop.ps1
      - name: Windows-Startdiagnose hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: insi-windows-startup-logs
          path: dist/windows-startup-logs/**
          if-no-files-found: warn
      - run: python tools/package_desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: insi-windows-x86_64
          path: dist/releases/windows/*.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux-GUI-Abhängigkeiten installieren
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          bubblewrap gcc libcairo2-dev libgirepository1.0-dev pkg-config python3-dev
          gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgtk-3-dev libwebkit2gtk-4.1-dev
          weston
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python tools/build_desktop_app.py
      - name: Eingebettetes Python prüfen
        run: '"dist/linux/insi/insi-python" --pykim-python -c "import pykim; print(pykim.__version__)"'
      - name: Linux-Bubblewrap und Ressourcengrenzen prüfen
        run: '"dist/linux/insi/insi-python" --pykim-python tools/check_linux_sandbox.py'
      - name: Geschütztes Linux-Wayland-Fenster prüfen
        shell: bash
        run: |
          runtime="$(mktemp -d "$RUNNER_TEMP/insi-wayland.XXXXXX")"
          chmod 700 "$runtime"
          export XDG_RUNTIME_DIR="$runtime"
          export WAYLAND_DISPLAY="wayland-insi"
          export SDL_VIDEODRIVER="wayland"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 >"$runtime/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; rm -rf "$runtime"' EXIT
          for attempt in {1..50}; do
            test -S "$runtime/$WAYLAND_DISPLAY" && break
            sleep 0.1
          done
          test -S "$runtime/$WAYLAND_DISPLAY"
          "dist/linux/insi/insi-python" --pykim-python tools/check_linux_sandbox.py --gui
      - run: python tools/package_desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: insi-linux-x86_64
          path: dist/releases/linux/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.architecture }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python tools/build_macos_dmg.py --rebuild-app
      - name: Eingebettetes Python prüfen
        run: '"dist/macos/insi.app/Contents/MacOS/insi-python" --pykim-python -c "import pykim; print(pykim.__version__)"'
      - name: macOS-Seatbelt und Ressourcengrenzen prüfen
        run: '"dist/macos/insi.app/Contents/MacOS/insi-python" --pykim-python tools/check_macos_sandbox.py'
      - name: Release-Datei in Buildordner kopieren
        run: |
          mkdir -p "dist/releases/macos-${{ matrix.architecture }}"
          cp dist/macos/*.dmg "dist/releases/macos-${{ matrix.architecture }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: insi-macos-${{ matrix.architecture }}
          path: dist/releases/macos-${{ matrix.architecture }}/*.dmg
          if-no-files-found: error

  release:
    name: GitHub-Release befüllen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: insi-*
          path: dist/releases
      - name: Release erstellen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "in:si $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/releases/*/* --clobber
